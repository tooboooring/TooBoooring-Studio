<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Video Production app4v</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
</head>
<body>
    <div class="toolbar">
        <button id="btn-load-video">Load Video</button>
        <button id="btn-detect-silence">Detect Silence</button>
        <select id="audio-track-selector" style="margin-left: 20px;"></select>
        <span id="status-label" style="margin-left: auto; color: #888;">No video loaded.</span>
    </div>

    <div id="main-content">
        
        <div id="player-panel" class="panel">
            <div class="panel-header">Preview</div>
            <div class="panel-content" style="background-color: black; padding: 0;">
                <video id="video-player" style="width: 100%; height: 100%;" controls></video>
            </div>
        </div>
        
        <div id="controls-panel" class="panel">
            <div class="panel-header">Controls</div>
            <div class="panel-content">
                <div class="control-group">
                    <input type="checkbox" id="skip-silence-check" style="margin-right: 5px;">
                    <label for="skip-silence-check">Skip Silence</label>
                </div>
                <hr>
                <strong>Encoder Settings</strong>
                <div class="control-group">
                    <label>Encoder:</label>
                    <select id="encoder-select"></select>
                </div>
                <div class="control-group">
                    <label>Format:</label>
                    <select id="format-select">
                        <option value="mp4">MP4</option>
                        <option value="mkv">MKV</option>
                    </select>
                </div>
                <hr>
                <strong>Trim Settings</strong>
                <div class="control-group">
                    <label>Start:</label>
                    <input type="text" id="trim-start" placeholder="0.0">
                </div>
                <div class="control-group">
                    <label>End:</label>
                    <input type="text" id="trim-end" placeholder="Full Duration">
                </div>
                <hr>
                <button id="btn-export-video" style="width: 100%; padding: 10px;">Export Video</button>
            </div>

            <div class="panel-header" style="border-top: 1px solid #444;">Console Output</div>
            <div class="panel-content" style="flex-grow: 0; height: 150px; background-color: #111; padding: 5px;">
                <textarea id="console-output" readonly></textarea>
            </div>
        </div>
    </div>
    
    <div id="timeline-panel" class="panel">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Interactive Timeline</span>
            <div class="timeline-controls">
                <button id="btn-scroll-start" title="Scroll to Start">|◀</button>
                <button id="btn-zoom-reset" title="Reset Zoom">100%</button>
                <button id="btn-scroll-end" title="Scroll to End">▶|</button>
            </div>
        </div>
        <div class="panel-content" style="padding: 5px; flex-grow: 1;">
            <div id="timeline-scroll-wrapper">
                <canvas id="ruler-canvas"></canvas>
                <canvas id="waveform-canvas"></canvas>
                <canvas id="segments-canvas"></canvas>
            </div>
        </div>
    </div>
    
    <script src="main.js" type="module"></script>
</body>
</html>
