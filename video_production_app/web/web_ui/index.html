<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Production Suite</title>

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons: FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="toolbar">
        <div class="toolbar-group">
          <button
            id="btn-load-video"
            class="btn btn-primary"
            aria-label="Load video file from disk"
            title="Load Video (Ctrl+O)"
          >
            <i class="fas fa-folder-open"></i> Load Video
          </button>
          <div class="divider-vertical"></div>
          <button
            id="btn-detect-silence"
            class="btn btn-secondary"
            aria-label="Detect silence segments in the selected audio track"
            title="Detect Silence"
          >
            <i class="fas fa-wave-square"></i> Detect Silence
          </button>
          <div class="select-wrapper">
            <select
              id="audio-track-selector"
              class="audio-track-selector"
              aria-label="Select audio track for silence detection"
              title="Audio Track"
            ></select>
          </div>
        </div>

        <div class="toolbar-group">
          <button
            id="btn-ai-analysis"
            class="btn btn-accent"
            aria-label="Run AI content analysis on audible segments"
            title="AI Analysis (requires together.ai API key)"
          >
            <i class="fas fa-robot"></i> AI Analysis
          </button>
        </div>

        <span
          id="status-label"
          class="status-label"
          role="status"
          aria-live="polite"
          >No video loaded.</span
        >
      </div>

      <div class="main-content">
        <!-- Player Panel -->
        <div id="player-panel" class="panel player-panel">
          <div class="panel-header"><i class="fas fa-film"></i> Preview</div>
          <div class="panel-content player-content">
            <div class="video-wrapper">
              <video
                id="video-player"
                controls
                aria-label="Video preview player"
              >
                Your browser does not support the video tag.
              </video>
            </div>
            <div class="player-controls-bar" role="toolbar" aria-label="Video playback controls">
              <div class="playback-controls">
                <button id="btn-previous-frame" class="btn-icon" title="Previous Frame" aria-label="Go to previous frame">
                  <i class="fas fa-step-backward"></i>
                </button>
                <button id="btn-play-pause" class="btn-icon" title="Play/Pause" aria-label="Play or pause video">
                  <i class="fas fa-play"></i>
                </button>
                <button id="btn-next-frame" class="btn-icon" title="Next Frame" aria-label="Go to next frame">
                  <i class="fas fa-step-forward"></i>
                </button>
                <button id="btn-stop" class="btn-icon" title="Stop" aria-label="Stop playback">
                  <i class="fas fa-stop"></i>
                </button>
              </div>
              <div class="time-display" id="time-display">00:00:00</div>
            </div>
          </div>
        </div>

        <!-- Vertical Splitter -->
        <div id="splitter-vertical" class="splitter-vertical"></div>

        <!-- Controls Panel -->
        <div id="controls-panel" class="panel controls-panel">
          <div class="panel-header"><i class="fas fa-sliders-h"></i> Controls</div>
          <div class="panel-content scrollable-content">
            
            <!-- AI Settings -->
            <div class="control-section">
              <label class="section-label">AI Settings</label>
              <div class="form-group">
                <label>AI Model</label>
                <div class="select-wrapper">
                  <select id="ai-model-select">
                    <option value="Llama 3.3 70B (Recommended)" selected>Llama 3.3 70B (Recommended)</option>
                    <option value="DeepSeek R1 (Ruthless)">DeepSeek R1 (Ruthless)</option>
                    <option value="Qwen 2.5 72B (Balanced)">Qwen 2.5 72B (Balanced)</option>
                    <option value="Llama 3.1 8B (Speed)">Llama 3.1 8B (Speed)</option>
                  </select>
                </div>
                <div id="ai-cost-estimate" class="helper-text">Est. Cost: $0.0000</div>
              </div>

              <div class="form-group">
                <label>History</label>
                <div class="select-wrapper">
                  <select id="ai-history-select" disabled>
                    <option value="">No runs yet</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label>Whisper Model</label>
                <div class="select-wrapper">
                  <select id="whisper-model-select">
                    <option value="tiny">Tiny (fastest)</option>
                    <option value="base" selected>Base (recommended)</option>
                    <option value="small">Small (better accuracy)</option>
                    <option value="medium">Medium (high accuracy)</option>
                    <option value="large">Large (best accuracy)</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                 <label>API Key</label>
                 <input type="password" id="ai-api-key" class="form-input" placeholder="Enter API Key">
              </div>

              <div id="ai-analysis-status" class="status-box" style="display: none">
                <div id="ai-analysis-summary"></div>
              </div>
            </div>

            <div class="divider-horizontal"></div>

            <!-- Audio Analysis -->
            <div class="control-section">
              <label class="section-label">Audio Analysis</label>
              <button id="btn-analyze-tracks" class="btn btn-secondary btn-full mb-2">
                Analyze All Tracks
              </button>
              <label class="sub-label">Track Details:</label>
              <textarea id="audio-details-textbox" readonly class="code-area"></textarea>
            </div>

            <div class="divider-horizontal"></div>

            <!-- Progress Panel -->
            <div class="control-section">
              <label class="section-label">Progress</label>
              <div id="progress-percentage" class="progress-text">0%</div>
              <div class="progress-container">
                <div id="progress-bar" class="progress-fill"></div>
              </div>
              <div id="progress-details" class="helper-text">Ready</div>
            </div>

            <div class="divider-horizontal"></div>

            <!-- Console Output -->
            <div class="control-section">
              <label class="section-label">Console Output</label>
              <textarea id="console-output" readonly class="console-area"></textarea>
            </div>

            <div class="divider-horizontal"></div>

            <!-- Action Buttons -->
            <div class="action-buttons">
              <button id="btn-export-video" class="btn btn-primary btn-lg btn-block" aria-label="Export processed video" title="Export Video (Ctrl+S)">
                <i class="fas fa-file-export"></i> Export Video
              </button>
              <div style="height: 8px;"></div>
              <button id="btn-export-cuts" class="btn btn-secondary btn-block" aria-label="Export cuts" title="Export in Cuts">
                <i class="fas fa-cut"></i> Export in Cuts
              </button>
              <div style="height: 8px;"></div>
              <div class="row gap-sm">
                <button id="btn-export-edl" class="btn btn-outline col" title="Export EDL">EDL</button>
                <button id="btn-export-xml" class="btn btn-outline col" title="Export XML">XML</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Horizontal Splitter -->
      <div id="splitter-horizontal" class="splitter-horizontal"></div>

      <div id="timeline-panel" class="timeline panel">
        <div class="panel-header">
          <span><i class="fas fa-stream"></i> Interactive Timeline</span>
          <div class="timeline-controls">
            <button
              id="btn-toggle-timeline"
              title="Collapse/Expand Timeline Panel"
              class="btn-icon-small"
              aria-label="Toggle timeline panel visibility"
            >
              <i class="fas fa-chevron-down"></i>
            </button>
            <!-- Statistics -->
            <span id="timeline-stats" class="stats-label">No data</span>

            <div class="divider-vertical-small"></div>

            <!-- Zoom Controls -->
            <div class="btn-group">
              <button
                id="btn-zoom-out"
                title="Zoom Out"
                class="btn-icon-small"
                aria-label="Zoom out timeline"
              >
                <i class="fas fa-search-minus"></i>
              </button>
              <span
                id="zoom-level"
                class="zoom-label"
                aria-label="Current zoom level"
                >1.0x</span
              >
              <button
                id="btn-zoom-in"
                title="Zoom In"
                class="btn-icon-small"
                aria-label="Zoom in timeline"
              >
                <i class="fas fa-search-plus"></i>
              </button>
              <button
                id="btn-zoom-reset"
                title="Reset Zoom"
                class="btn-text-small"
                aria-label="Reset zoom to 100%"
              >
                100%
              </button>
            </div>

            <div class="divider-vertical-small"></div>

            <!-- Scroll Controls -->
            <div class="btn-group">
              <button
                id="btn-scroll-start"
                title="Scroll to Start"
                class="btn-icon-small"
                aria-label="Scroll timeline to start"
              >
                <i class="fas fa-fast-backward"></i>
              </button>
              <button
                id="btn-scroll-left"
                title="Scroll Left"
                class="btn-icon-small"
                aria-label="Scroll timeline left"
              >
                <i class="fas fa-backward"></i>
              </button>
              <button
                id="btn-scroll-right"
                title="Scroll Right"
                class="btn-icon-small"
                aria-label="Scroll timeline right"
              >
                <i class="fas fa-forward"></i>
              </button>
              <button
                id="btn-scroll-end"
                title="Scroll to End"
                class="btn-icon-small"
                aria-label="Scroll timeline to end"
              >
                <i class="fas fa-fast-forward"></i>
              </button>
            </div>
          </div>
        </div>
        <div
          class="panel-content timeline-content"
          role="region"
          aria-label="Interactive timeline"
        >
          <canvas id="ruler-canvas" class="timeline-canvas ruler"></canvas>
          <canvas
            id="waveform-canvas"
            class="timeline-canvas waveform"
          ></canvas>
          <canvas
            id="segments-canvas"
            class="timeline-canvas segments"
          ></canvas>
        </div>
      </div>
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
