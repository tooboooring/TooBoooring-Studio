<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Production Suite</title>

  <!-- Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Icons: FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    
    <!-- HEADER BAR -->
    <header class="header">
      <div class="header-left">
        <span class="app-title">TB Studio</span>
      </div>

      <div class="header-center">
        <div class="status-indicator"></div>
        <span id="status-label" class="status-text">System Ready: PyWebView bridge connected.</span>
      </div>

      <div class="header-right">
        <button id="btn-export-video-header" class="btn-export-header">
          <i class="fas fa-download"></i> Export
        </button>
      </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="main-workspace">
      
      <!-- TOP SECTION: Left Panel + Video Player -->
      <div class="workspace-top">
        
        <!-- LEFT PANEL: Tabbed Sidebar -->
        <aside class="left-panel">
          
          <!-- Tabs Header -->
          <div class="tabs-header">
            <button class="tab-button active" data-tab="media">
              <i class="fas fa-layer-group"></i> Media
            </button>
            <button class="tab-button" data-tab="ai">
              <i class="fas fa-wand-magic-sparkles"></i> AI Tools
            </button>
            <button class="tab-button" data-tab="export">
              <i class="fas fa-file-video"></i> Export
            </button>
          </div>

          <!-- Tabs Content -->
          <div class="tab-content">
            
            <!-- TAB: MEDIA LIBRARY -->
            <div id="tab-media" class="tab-pane active">
              
              <div class="tab-section">
                <button id="btn-load-video" class="btn btn-primary btn-block" style="margin-bottom: 16px;">
                  <i class="fas fa-folder-open"></i> Load Video
                </button>

                <input type="file" id="file-input" accept="video/*" style="display: none;" />

                <div class="upload-zone" id="upload-zone">
                  <i class="fas fa-folder-open"></i>
                  <p>Click to browse for video</p>
                  <span class="upload-hint">Select a video file to load</span>
                </div>
              </div>

              <div class="section-divider"></div>

              <!-- Audio Analysis Section -->
              <div class="tab-section">
                <h3 class="section-title">
                  <i class="fas fa-volume-up"></i> Audio Analysis
                </h3>

                <div class="control-box">
                  <div class="form-group">
                    <label class="form-label">Target Track</label>
                    <select id="audio-track-selector" class="form-select">
                      <option value="">No tracks loaded</option>
                    </select>
                  </div>

                  <button id="btn-detect-silence" class="btn btn-secondary btn-block">
                    <i class="fas fa-bolt"></i> Detect Silence
                  </button>
                </div>

                <div class="form-group mt-2">
                  <label class="form-label">Track Details</label>
                  <textarea id="audio-details-textbox" class="audio-details-box" readonly></textarea>
                </div>

                <button id="btn-analyze-tracks" class="btn btn-outline btn-block mt-1">
                  Analyze All Tracks
                </button>
              </div>

            </div>

            <!-- TAB: AI TOOLS -->
            <div id="tab-ai" class="tab-pane">
              
              <!-- AI Content Analysis Section -->
              <div class="tab-section">
                <h3 class="section-title">
                  <i class="fas fa-wand-magic-sparkles"></i> Content AI
                </h3>

                <div class="form-group">
                  <label class="form-label">LLM Model</label>
                  
                  <label class="model-option" data-tooltip="Personality: Friendly & Lenient&#10;Best For: Vlogs, Tutorials, Narrative Content&#10;Cut Rate: Low (~5%)&#10;Cost: $0.88/1M tokens&#10;&#10;Strengths: Excellent narrative flow, keeps personality and natural pauses. Great for content where authenticity matters.">
                    <input type="radio" name="ai_model" value="Llama 3.3 70B (Recommended)" checked />
                    <div class="model-info">
                      <div class="model-header">
                        <span class="model-name">Llama 3.3 70B</span>
                        <span class="model-badge">Balanced</span>
                      </div>
                      <p class="model-desc">The Storyteller (Recommended)</p>
                    </div>
                  </label>

                  <label class="model-option" data-tooltip="Personality: Ruthless & Strict&#10;Best For: TikToks, Reels, Highlights&#10;Cut Rate: High (~75%)&#10;Cost: $4.00/1M tokens&#10;&#10;Strengths: Removes ALL fluff. Creates high-density, fast-paced content. Perfect for viral short-form videos.">
                    <input type="radio" name="ai_model" value="DeepSeek R1 (Ruthless)" />
                    <div class="model-info">
                      <div class="model-header">
                        <span class="model-name">DeepSeek R1</span>
                        <span class="model-badge">Ruthless</span>
                      </div>
                      <p class="model-desc">The Viral Editor</p>
                    </div>
                  </label>

                  <label class="model-option" data-tooltip="Personality: Balanced & Logical&#10;Best For: Corporate, Educational, Lectures&#10;Cut Rate: Medium (~15%)&#10;Cost: $1.20/1M tokens&#10;&#10;Strengths: Great at following strict formatting rules. Professional tone, removes only unnecessary pauses.">
                    <input type="radio" name="ai_model" value="Qwen 2.5 72B (Balanced)" />
                    <div class="model-info">
                      <div class="model-header">
                        <span class="model-name">Qwen 2.5 72B</span>
                        <span class="model-badge">Logical</span>
                      </div>
                      <p class="model-desc">The Professional</p>
                    </div>
                  </label>

                  <label class="model-option" data-tooltip="Personality: Fast but Basic&#10;Best For: Quick tests, Rough cuts&#10;Cut Rate: Variable&#10;Cost: $0.18/1M tokens (Cheapest!)&#10;&#10;Strengths: Extremely cheap and fast. Ideal for rapid iteration and testing before committing to premium models.">
                    <input type="radio" name="ai_model" value="Llama 3.1 8B (Speed)" />
                    <div class="model-info">
                      <div class="model-header">
                        <span class="model-name">Llama 3.1 8B</span>
                        <span class="model-badge">Fast</span>
                      </div>
                      <p class="model-desc">The Draftsman</p>
                    </div>
                  </label>
                </div>

                <div class="form-group">
                  <label class="form-label">Whisper Model</label>
                  <select id="whisper-model-select" class="form-select">
                    <option value="tiny">Tiny (fastest)</option>
                    <option value="base" selected>Base (recommended)</option>
                    <option value="small">Small (better accuracy)</option>
                    <option value="medium">Medium (high accuracy)</option>
                    <option value="large">Large (best accuracy)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label">API Key</label>
                  <input type="password" id="ai-api-key" class="form-input" placeholder="Enter together.ai API key" />
                </div>

                <button id="btn-ai-analysis" class="btn btn-primary btn-block">
                  <i class="fas fa-wand-magic-sparkles"></i> Run AI Analysis
                </button>

                <p id="ai-cost-estimate" class="cost-estimate">Est. Cost: $0.0000</p>

                <!-- AI Analysis Results -->
                <div id="ai-analysis-status" class="ai-status-box" style="display: none;">
                  <div id="ai-analysis-summary"></div>
                </div>

                <!-- AI History Selector -->
                <div class="form-group mt-2">
                  <label class="form-label">History</label>
                  <select id="ai-history-select" class="form-select" disabled>
                    <option value="">No runs yet</option>
                  </select>
                </div>
              </div>

              <div class="section-divider"></div>

              <!-- Progress Section -->
              <div class="tab-section progress-section">
                <h3 class="section-title">
                  <i class="fas fa-chart-line"></i> Progress
                </h3>

                <div id="progress-percentage" class="progress-percentage">0%</div>
                <div class="progress-container">
                  <div id="progress-bar" class="progress-fill"></div>
                </div>
                <div id="progress-details" class="progress-details">Ready</div>
              </div>

              <div class="section-divider"></div>

              <!-- Console Output -->
              <div class="tab-section">
                <h3 class="section-title">
                  <i class="fas fa-terminal"></i> Console Output
                </h3>
                <textarea id="console-output" class="console-area" readonly></textarea>
              </div>

            </div>

            <!-- TAB: EXPORT -->
            <div id="tab-export" class="tab-pane">
              
              <div class="tab-section">
                <h3 class="section-title">Output Settings</h3>

                <div class="control-box">
                  <div class="form-group">
                    <label class="form-label">Save Destination</label>
                    <button id="btn-select-destination" class="btn btn-outline btn-block">
                      <i class="fas fa-folder-open"></i> Select Folder
                    </button>
                    <div id="save-destination-label" class="destination-label" style="margin-top: 8px; font-size: 12px; color: #888; word-break: break-all;">
                      No destination selected
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Encoder</label>
                    <select id="encoder-select" class="form-select">
                      <option>NVIDIA NVENC H.264 (GPU)</option>
                      <option>CPU (x264)</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Format</label>
                    <select id="format-select" class="form-select">
                      <option value="mp4">MP4 (H.264)</option>
                      <option value="mov">MOV (ProRes)</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Trim Start (seconds)</label>
                    <input type="number" id="trim-start" class="form-input" placeholder="0" step="0.1" />
                  </div>

                  <div class="form-group">
                    <label class="form-label">Trim End (seconds)</label>
                    <input type="number" id="trim-end" class="form-input" placeholder="Auto" step="0.1" />
                  </div>
                </div>
              </div>

              <div class="section-divider"></div>

              <div class="tab-section">
                <h3 class="section-title">Render Queue</h3>

                <button id="btn-export-video" class="btn btn-primary btn-block btn-lg">
                  <i class="fas fa-download"></i> Export Video
                </button>

                <div class="button-grid mt-2">
                  <button id="btn-export-cuts" class="btn btn-outline">
                    Export Cuts
                  </button>
                  <button id="btn-export-xml" class="btn btn-outline">
                    XML (FCP)
                  </button>
                  <button id="btn-export-edl" class="btn btn-outline">
                    EDL
                  </button>
                </div>
              </div>

            </div>

          </div>
        </aside>

        <!-- CENTER PANEL: Video Player -->
        <main class="center-panel">
          
          <!-- Audio Track Mixer -->
          <div id="audio-track-mixer" class="audio-track-mixer" style="display: none;">
            <div class="mixer-header">
              <i class="fas fa-volume-up"></i>
              <span>Audio Tracks</span>
            </div>
            <div id="audio-track-list" class="audio-track-list">
              <!-- Audio tracks will be dynamically added here -->
            </div>
          </div>

          <div class="player-wrapper">
            <!-- Video Element -->
            <video id="video-player" controls>
              Your browser does not support the video tag.
            </video>

            <!-- Player Controls Overlay (Bottom) -->
            <div class="player-overlay">
              <button id="btn-previous-frame" class="btn-icon" title="Previous Frame">
                <i class="fas fa-step-backward"></i>
              </button>
              <button id="btn-play-pause" class="play-button" title="Play/Pause">
                <i class="fas fa-play"></i>
              </button>
              <button id="btn-next-frame" class="btn-icon" title="Next Frame">
                <i class="fas fa-step-forward"></i>
              </button>
              <button id="btn-stop" class="btn-icon" title="Stop">
                <i class="fas fa-stop"></i>
              </button>
            </div>
          </div>

        </main>

      </div>

      <!-- BOTTOM SECTION: Timeline (Full Width) -->
      <section class="timeline-panel">
        
        <!-- Timeline Toolbar -->
        <div class="timeline-toolbar">
          <div class="timeline-toolbar-left">
            <label class="checkbox-label">
              <input type="checkbox" id="skip-silence-check" />
              <span>Skip Silence</span>
            </label>
          </div>

          <div class="timeline-toolbar-right">
            <span id="timeline-stats" class="stats-label">No data</span>

            <div class="tool-divider"></div>

            <div class="zoom-controls">
              <i class="fas fa-search-minus"></i>
              <input id="zoom-slider" type="range" min="1" max="100" value="10" class="zoom-slider" />
              <i class="fas fa-search-plus"></i>
              <span id="zoom-level" class="stats-label">1.0x</span>
            </div>

            <button id="btn-zoom-reset" class="tool-btn" title="Reset Zoom">100%</button>

            <div class="tool-divider"></div>

            <button id="btn-scroll-start" class="tool-btn" title="Scroll to Start">
              <i class="fas fa-fast-backward"></i>
            </button>
            <button id="btn-scroll-left" class="tool-btn" title="Scroll Left">
              <i class="fas fa-backward"></i>
            </button>
            <button id="btn-scroll-right" class="tool-btn" title="Scroll Right">
              <i class="fas fa-forward"></i>
            </button>
            <button id="btn-scroll-end" class="tool-btn" title="Scroll to End">
              <i class="fas fa-fast-forward"></i>
            </button>
          </div>
        </div>

        <!-- Timeline Body -->
        <div class="timeline-body">
          <!-- Timeline Canvas Area (Full Width) -->
          <div class="timeline-canvas-wrapper">
            <canvas id="ruler-canvas" class="ruler-canvas"></canvas>
            <canvas id="waveform-canvas" class="waveform-canvas"></canvas>
            <canvas id="segments-canvas" class="segments-canvas"></canvas>
          </div>
        </div>

      </section>

    </div>

  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
